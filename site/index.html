<!doctype html>

<title>Hook Echo</title>
<meta name="description" content="Live US storms, tornado paths and warnings, watching the places your people are.">
<meta name="theme-color" content="#0d1217">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
  // Apply the saved theme before first paint so the page never flashes the wrong one.
  try {
    var saved = JSON.parse(localStorage.getItem('hook-echo:settings') || '{}').theme;
    if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>

<div class="app" id="app">
  <div id="map" class="map" role="region" aria-label="Storm map. Use the panel to browse warnings and places."></div>

  <div class="map-chrome">
    <div class="map-controls" id="map-controls">
      <button class="map-btn" id="btn-layers" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="layers-menu" title="Map layers">
        <svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg><span class="sr-only">Map layers</span>
      </button>
      <button class="map-btn" id="btn-locate" type="button" aria-pressed="false" title="Follow where I am">
        <svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg><span class="sr-only">Follow where I am</span>
      </button>
      <div class="map-zoom" role="group" aria-label="Zoom">
        <button class="map-btn" id="zoom-in" type="button" title="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="sr-only">Zoom in</span></button>
        <button class="map-btn" id="zoom-out" type="button" title="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg><span class="sr-only">Zoom out</span></button>
      </div>
    </div>
    <div id="layers-menu" class="popover layers-menu" role="dialog" aria-label="Map layers" hidden></div>
    <div id="timeline" class="timeline" role="group" aria-label="Radar loop"></div>
    <div id="map-hint" class="map-hint" role="status" hidden></div>
  </div>

  <aside id="panel" class="panel" aria-label="Storms and your places" data-sheet="peek">
    <button class="sheet-grip" id="sheet-grip" type="button" aria-controls="panel" aria-expanded="false">
      <span class="sheet-grip-bar" aria-hidden="true"></span><span class="sr-only">Show more of the panel</span>
    </button>
    <header class="panel-head" id="panel-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-hook"/></svg>
        <span class="brand-name">Hook Echo</span>
      </div>
      <button class="live" id="live-status" type="button" aria-haspopup="dialog" aria-controls="sources-dialog">
        <span class="live-dot" aria-hidden="true"></span><span class="live-text">Loading</span>
      </button>
      <button class="icon-btn" id="open-settings" type="button" aria-haspopup="dialog" aria-controls="settings-dialog" title="Settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="sr-only">Settings</span>
      </button>
    </header>
    <div id="banners" class="banners"></div>
    <section id="summary" class="summary" aria-label="Active right now"></section>
    <div id="headline" class="headline"></div>
    <nav class="tabs" role="tablist" aria-label="Panel">
      <button class="tab" role="tab" id="tab-now" aria-controls="view-now" aria-selected="true" type="button">Now</button>
      <button class="tab" role="tab" id="tab-people" aria-controls="view-people" aria-selected="false" tabindex="-1" type="button">People</button>
      <button class="tab" role="tab" id="tab-trips" aria-controls="view-trips" aria-selected="false" tabindex="-1" type="button">Trips</button>
      <button class="tab" role="tab" id="tab-reports" aria-controls="view-reports" aria-selected="false" tabindex="-1" type="button">Reports</button>
    </nav>
    <div class="views" id="views">
      <section class="view" id="view-now" role="tabpanel" aria-labelledby="tab-now" tabindex="0"></section>
      <section class="view" id="view-people" role="tabpanel" aria-labelledby="tab-people" tabindex="0" hidden></section>
      <section class="view" id="view-trips" role="tabpanel" aria-labelledby="tab-trips" tabindex="0" hidden></section>
      <section class="view" id="view-reports" role="tabpanel" aria-labelledby="tab-reports" tabindex="0" hidden></section>
      <section class="view view-detail" id="view-detail" aria-live="polite" tabindex="-1" hidden></section>
    </div>
    <footer class="panel-foot">Not an official warning source. Keep Wireless Emergency Alerts on.</footer>
  </aside>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
</div>

<dialog id="takeover" class="takeover" role="alertdialog" aria-labelledby="takeover-title" aria-describedby="takeover-body"></dialog>
<dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title"></dialog>
<dialog id="sources-dialog" class="dialog" aria-labelledby="sources-title"></dialog>
<dialog id="place-dialog" class="dialog" aria-labelledby="place-title"></dialog>
<dialog id="confirm-dialog" class="dialog dialog-small" aria-labelledby="confirm-title"></dialog>

<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
